<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar — REINVENTA by Mary Méndez</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --plum: #2A0F25;
      --gold: #C6A56A;
      --ink: #221019;
      --cream: #EFE9E2;
      --mauve: #8F7383;
    }
    body {
      min-height: 100dvh;
      background: rgba(26,9,20,.96);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.4rem 1rem 2rem;
      font-family: 'Gill Sans','Gill Sans MT','Segoe UI',Calibri,sans-serif;
      color: var(--ink);
    }
    .box {
      background: var(--cream);
      max-width: 480px;
      width: 100%;
      padding: clamp(2rem,6vw,3.2rem);
      margin: auto;
      text-align: center;
    }
    .logo {
      display: block;
      margin-bottom: 2rem;
    }
    .logo img { height: 36px; }
    .eyebrow {
      display: inline-block;
      font-size: .7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--mauve);
      margin-bottom: 1.2rem;
    }
    .divider {
      width: 2rem;
      height: 1px;
      background: var(--gold);
      margin: 1.4rem auto;
      opacity: .6;
    }
    h2 {
      font-family: 'Big Caslon','Didot',Georgia,serif;
      font-weight: 400;
      font-size: 1.6rem;
      color: var(--plum);
      line-height: 1.3;
      margin-bottom: 1rem;
    }
    p {
      font-size: .95rem;
      color: #5a4450;
      line-height: 1.7;
      max-width: 34ch;
      margin: 0 auto;
    }
    .cta {
      display: inline-block;
      margin-top: 2rem;
      padding: .85rem 2rem;
      background: var(--plum);
      color: var(--cream);
      font-family: inherit;
      font-size: .82rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-decoration: none;
      transition: opacity .2s;
    }
    .cta:hover { opacity: .8; }
    .nota {
      margin-top: 1.4rem;
      font-size: .75rem;
      color: var(--mauve);
    }
  </style>
  <!-- Vercel Analytics + Speed Insights -->
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
<div class="box">
  <a class="logo" href="/">
    <img src="assets/icons/imagotipo-dorado.png" alt="REINVENTA by Mary Méndez" />
  </a>

  <span class="eyebrow">Primera edición · Agosto 2026</span>

  <h2>Esta edición<br>ya concluyó</h2>

  <div class="divider"></div>

  <p>El taller <em>Lo que tu imagen comunica</em> ya se llevó a cabo el 15 de agosto de 2026. El acceso a reservaciones está cerrado.</p>

  <a href="/taller-imagen-personal" class="cta">Ver lo que vivimos</a>

  <p class="nota">¿Te interesa la siguiente edición? Puedes dejar tu nombre en la página del taller.</p>
</div>
